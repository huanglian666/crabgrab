[package]
name = "crabgrab"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.45", features = ["derive"] }
directories = "6.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
toml = "0.8"

[dev-dependencies]
httpmock = "0.7"
serde_json = "1.0"
